name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate registry.json
        run: python3 tools/validate_registry.py

      - name: Derived files are up to date
        run: python3 tools/gen_derived.py --check

      - name: Provider registry ids resolve
        run: python3 tools/check_provider_ids.py

      - name: GitHub Pages will serve every module
        run: python3 tools/check_pages.py

      - name: Pack build tests
        run: |
          pip install --quiet pytest
          PYTHONPATH=tools python3 -m pytest tools/packbuild/tests -q

      - name: Committed packs are valid
        run: PYTHONPATH=tools python3 -m packbuild validate

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the MCP server
        working-directory: mcp
        run: |
          npm install
          npm run build

      # Hits live government APIs, so a red run here can mean an upstream
      # outage rather than a regression — check the log before assuming a bug.
      - name: Smoke-test every tool
        working-directory: mcp
        run: npm run smoke

      # The hosted endpoint is what most people connect to, so it gets the same
      # treatment: this drives api/mcp.mjs, not just the stdio path.
      - name: Smoke-test the hosted endpoint's entrypoint
        working-directory: mcp
        run: npm run smoke:http
